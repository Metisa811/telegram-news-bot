name: News Bot Runner

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدت اجرا به دقیقه (برای تست 10 بگذار)'
        required: false
        default: '330'

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: راه‌اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب پکیج‌ها
        run: pip install feedparser requests

      - name: تنظیم git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: اجرای ربات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          PYTHONUNBUFFERED: '1'
        run: python bot.py

      - name: ذخیره‌ی نهایی داده‌ها
        if: always()
        run: |
          git add sent_articles.json || true
          git add news_archive.jsonl || true
          git commit -m "Update news data [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push
